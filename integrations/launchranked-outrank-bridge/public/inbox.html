<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private webhook inbox</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    body { max-width: 900px; margin: 6vh auto; padding: 20px; color: #202124; line-height: 1.5; }
    main { border: 1px solid #e5e7eb; border-radius: 16px; padding: 24px; }
    h1 { font-size: 1.3rem; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #c9cdd4; border-radius: 8px; }
    button { margin-top: 12px; border: 0; border-radius: 8px; background: #111827; color: white; padding: 11px 16px; cursor: pointer; }
    pre { margin-top: 20px; padding: 16px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; background: #f5f6f8; border-radius: 10px; font-size: 12px; }
    .note { color: #626a73; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Private LaunchRanked event inbox</h1>
    <p class="note">Enter the BRIDGE_ADMIN_TOKEN stored in Netlify. The token is sent only to this site's protected inbox function and is not saved in this page.</p>
    <form id="inbox-form">
      <label for="token">Bridge admin token</label>
      <input id="token" type="password" autocomplete="off" required>
      <button type="submit">Load latest events</button>
    </form>
    <pre id="output" aria-live="polite">No events loaded.</pre>
  </main>
  <script>
    const form = document.getElementById("inbox-form");
    const tokenInput = document.getElementById("token");
    const output = document.getElementById("output");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      output.textContent = "Loading…";
      try {
        const response = await fetch("/.netlify/functions/inbox", {
          headers: { Authorization: "Bearer " + tokenInput.value }
        });
        const data = await response.json();
        if (!response.ok) {
          output.textContent = "Request failed (" + response.status + "): " + (data.error || "unknown_error");
          return;
        }
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = "Could not load inbox: " + error.message;
      }
    });
  </script>
</body>
</html>
