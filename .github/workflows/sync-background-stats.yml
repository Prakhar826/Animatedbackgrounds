name: Sync global background stats

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "assets/js/app.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-background-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh all global view and like counters
        run: node .github/scripts/sync-background-stats.mjs

      - name: Commit the shared stats snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add data/stats.json
          if git diff --cached --quiet; then
            echo "The global stats snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh global background likes and views"
          git push origin HEAD:main
