name: Publish LaunchRanked articles to Outrank

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "content/blog/**/*.mdx"

permissions:
  contents: read

concurrency:
  group: outrank-blog-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged article
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish approved article(s) to Outrank
        env:
          OUTRANK_API_KEY: ${{ secrets.OUTRANK_API_KEY }}
          OUTRANK_EXPECTED_BLOG_DOMAIN: blog.animatedbackgrounds.me
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: node .github/scripts/publish-launchranked-article.mjs
