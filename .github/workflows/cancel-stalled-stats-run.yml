name: Cancel stalled single-run stats refresh

on:
  push:
    branches: [main]
    paths:
      - "backlink-queue/cancel-stats-run-458233.json"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stalled full-library snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --silent --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/45823338610/cancel"
          echo "Cancellation requested for the single-run snapshot."
