name: Live Abacus counter smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/test-live-abacus.mjs"
      - ".github/workflows/live-abacus-smoke.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify live Abacus increment and read
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node .github/scripts/test-live-abacus.mjs
