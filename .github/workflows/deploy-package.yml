name: Deploy Animated Backgrounds package to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'animatedbackgrounds-deploy-ready-secure.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Extract site package
        run: |
          test -f animatedbackgrounds-deploy-ready-secure.zip || {
            echo "Upload animatedbackgrounds-deploy-ready-secure.zip to the repository root first."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/animatedbackgrounds-site"
          unzip -q "$GITHUB_WORKSPACE/animatedbackgrounds-deploy-ready-secure.zip" -d "$RUNNER_TEMP/animatedbackgrounds-site"

      - name: Build static site
        working-directory: ${{ runner.temp }}/animatedbackgrounds-site
        run: node scripts/build.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/animatedbackgrounds-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
