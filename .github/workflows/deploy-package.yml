name: Deploy Animated Backgrounds package to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'animatedbackgrounds-deploy-ready-secure.zip'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Extract and build the new site
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="$GITHUB_WORKSPACE/.github/deploy-source/animatedbackgrounds-deploy-ready-secure.zip"
          if [ -f "$GITHUB_WORKSPACE/animatedbackgrounds-deploy-ready-secure.zip" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.github/deploy-source"
            cp "$GITHUB_WORKSPACE/animatedbackgrounds-deploy-ready-secure.zip" "$SOURCE_ZIP"
          fi
          test -f "$SOURCE_ZIP" || {
            echo "Deployment archive not found in .github/deploy-source/."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/animatedbackgrounds-site"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/animatedbackgrounds-site"
          cd "$RUNNER_TEMP/animatedbackgrounds-site"
          node scripts/build.mjs
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/ads.txt
          test -f dist/sitemap.xml

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/animatedbackgrounds-site/dist

      - name: Replace old repository files with the new project source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/dist/' \
            "$RUNNER_TEMP/animatedbackgrounds-site/" "$GITHUB_WORKSPACE/"
          git -C "$GITHUB_WORKSPACE" add -A
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
            git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$GITHUB_WORKSPACE" commit -m "chore: replace legacy site files with new project source"
            git -C "$GITHUB_WORKSPACE" push origin HEAD:main
          else
            echo "Repository already matches the new project source."
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
