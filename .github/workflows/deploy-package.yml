name: Build and replace Animated Backgrounds site

on:
  push:
    branches: [main]
    paths:
      - 'animatedbackgrounds-deploy-ready-secure.zip'
      - '.github/workflows/deploy-package.yml'
      - 'assets/js/app.js'
      - 'assets/css/app.css'
      - 'sw.js'
      - 'data/backgrounds.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animatedbackgrounds-main-writers
  cancel-in-progress: false

jobs:
  build-and-replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fast-forward to the latest main before building
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Preserve source archive and build the new site
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/.github/deploy-source"
          SOURCE_ZIP="$SOURCE_DIR/animatedbackgrounds-deploy-ready-secure.zip"
          if [ -f "$GITHUB_WORKSPACE/animatedbackgrounds-deploy-ready-secure.zip" ]; then
            mkdir -p "$SOURCE_DIR"
            cp "$GITHUB_WORKSPACE/animatedbackgrounds-deploy-ready-secure.zip" "$SOURCE_ZIP"
          fi
          test -f "$SOURCE_ZIP" || {
            echo "Deployment archive not found."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/animatedbackgrounds-site"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/animatedbackgrounds-site"
          # Keep live screenshot edits made through Global Sync when rebuilding from the seed archive.
          SITE_SOURCE="$RUNNER_TEMP/animatedbackgrounds-site"
          if [ -f "$GITHUB_WORKSPACE/data/backgrounds.json" ]; then
            install -D "$GITHUB_WORKSPACE/data/backgrounds.json" "$SITE_SOURCE/data/backgrounds.json"
          fi
          # Keep the latest shared likes/views snapshot when rebuilding from the seed archive.
          if [ -f "$GITHUB_WORKSPACE/data/stats.json" ]; then
            install -D "$GITHUB_WORKSPACE/data/stats.json" "$SITE_SOURCE/data/stats.json"
          fi
          if [ -d "$GITHUB_WORKSPACE/assets/shots" ]; then
            mkdir -p "$SITE_SOURCE/assets/shots"
            cp -a "$GITHUB_WORKSPACE/assets/shots/." "$SITE_SOURCE/assets/shots/"
          fi
          cd "$SITE_SOURCE"
          node scripts/build.mjs
          # Apply owner-managed custom screenshots to every generated static HTML page.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const dist = path.resolve('dist');
          const library = JSON.parse(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'data/backgrounds.json'), 'utf8'));
          const htmlFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) htmlFiles.push(full);
            }
          }
          walk(dist);

          let updated = 0;
          for (const bg of (library.backgrounds || [])) {
            const id = String(bg.id || '');
            const custom = typeof bg.screenshotUrl === 'string' ? bg.screenshotUrl.trim() : '';
            if (!/^[A-Za-z0-9_-]+$/.test(id) || !custom) continue;
            if (!/^https:\/\//i.test(custom) && !/^\/assets\/shots\/[A-Za-z0-9_-]+\.jpg(?:\?v=\d+)?$/i.test(custom)) continue;
            const absolute = custom.startsWith('/') ? 'https://animatedbackgrounds.me' + custom : custom;
            const bare = custom.replace(/^\//, '');
            const oldAbsolute = 'https://animatedbackgrounds.me/assets/shots/' + id + '.jpg';
            const oldPath = '/assets/shots/' + id + '.jpg';
            const oldBare = 'assets/shots/' + id + '.jpg';
            for (const file of htmlFiles) {
              let html = fs.readFileSync(file, 'utf8');
              const before = html;
              html = html.split(oldAbsolute).join(absolute);
              html = html.split(oldPath).join(custom);
              html = html.split(oldBare).join(bare);
              if (html !== before) {
                fs.writeFileSync(file, html);
                updated++;
              }
            }
          }
          console.log('Applied custom screenshots to ' + updated + ' generated HTML files.');
          NODE
      - name: Patch generated HTML with the preview sidebar and first-load animation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/animatedbackgrounds-site"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const dist = path.resolve('dist');
          const preloader = "<div class=\"site-preloader\" id=\"site-preloader\" role=\"status\" aria-live=\"polite\">\n  <div class=\"preloader-mark\" aria-hidden=\"true\">\n    <span class=\"preloader-ring\"></span>\n    <img src=\"/assets/icons/android-chrome-192x192.png\" alt=\"\" width=\"36\" height=\"36\">\n  </div>\n  <strong class=\"preloader-brand\">Animated Backgrounds</strong>\n  <span class=\"preloader-caption\">Preparing your gallery…</span>\n  <span class=\"preloader-progress\" aria-hidden=\"true\"><span></span></span>\n</div>\n<noscript><style>.site-preloader{display:none!important}</style></noscript>";

          const htmlFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.html')) htmlFiles.push(full);
            }
          }
          walk(dist);

          let preloaderAdded = 0;
          let previewLayoutAdded = 0;
          for (const file of htmlFiles) {
            let html = fs.readFileSync(file, 'utf8');
            const before = html;

            if (!html.includes('id="site-preloader"')) {
              const body = html.match(/<body\b[^>]*>/i);
              if (body) {
                html = html.replace(body[0], body[0] + '\n  ' + preloader);
                preloaderAdded++;
              }
            }

            if (!html.includes('id="modal-layout"') && html.includes('id="bg-modal"')) {
              const pattern = /([ \t]*<div class="modal-stage" id="modal-stage"><\/div>)([\s\S]*?)([ \t]*<section class="modal-recs" id="modal-recs"[^>]*><\/section>)/;
              const match = html.match(pattern);
              if (!match) {
                throw new Error('Could not locate preview modal structure in ' + path.relative(dist, file));
              }
              const [, stage, between, recommendations] = match;
              const layout = '      <div class="modal-layout" id="modal-layout">\n' +
                '        ' + recommendations.trim() + '\n' +
                '        <div class="modal-main">\n' +
                stage + between + '\n' +
                '        </div>\n' +
                '      </div>';
              html = html.replace(pattern, layout);
              previewLayoutAdded++;
            }

            if (html !== before) fs.writeFileSync(file, html);
          }

          console.log('Added first-load animation to ' + preloaderAdded + ' HTML pages.');
          console.log('Added explicit preview/sidebar layout to ' + previewLayoutAdded + ' HTML pages.');
          if (!preloaderAdded && !previewLayoutAdded) {
            console.log('Generated HTML already contains the required layout.');
          }
          NODE

          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/CNAME
          test -f dist/ads.txt
          test -f dist/sitemap.xml
          test -f dist/site.webmanifest
          echo "Built static site with $(find dist -type f | wc -l) files."

      - name: Replace old published files with the fresh static build
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/assets/js/app.js' \
            --exclude='/assets/css/app.css' \
            --exclude='/sw.js' \
            "$RUNNER_TEMP/animatedbackgrounds-site/dist/" "$GITHUB_WORKSPACE/"
          CACHE_VERSION="$(git -C "$GITHUB_WORKSPACE" rev-parse --short=12 HEAD)"
          find "$GITHUB_WORKSPACE" -type f -name '*.html' ! -path "$GITHUB_WORKSPACE/.git/*" -print0 | while IFS= read -r -d '' html; do
            sed -i -E "s#(/assets/js/app\\.js\\?v=)[^\"' ]+#\\1${CACHE_VERSION}#g; s#(/assets/css/app\\.css\\?v=)[^\"' ]+#\\1${CACHE_VERSION}#g" "$html"
          done
          git -C "$GITHUB_WORKSPACE" add -A
          if ! git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
            git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$GITHUB_WORKSPACE" commit -m "chore: replace legacy site with generated static build"
            for attempt in 1 2 3; do
              git -C "$GITHUB_WORKSPACE" fetch origin main
              git -C "$GITHUB_WORKSPACE" rebase origin/main
              if git -C "$GITHUB_WORKSPACE" push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not push deployment commit after three attempts."
                exit 1
              fi
              sleep 2
            done
          else
            echo "Repository already matches the generated static build."
          fi
